<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y.O.K.E.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOCK SCREEN (before birthday) -->
  <section id="lock" class="screen">
    <h1>Y.O.K.E.</h1>
    <p class="tag">You're Our Kind of Everything</p>
    <img id="lockPic" class="cartoon" alt="">
    <p>Something special is waiting for you, <span class="her"></span> 💛</p>
    <div id="countdown">--</div>
  </section>

  <!-- MAIN APP -->
  <main id="app" class="hidden">
    <header>
      <img id="avatar" class="avatar" alt="">
      <div>
        <h2>Y.O.K.E.</h2>
        <small>You're Our Kind of Everything</small>
      </div>
    </header>

    <div id="chat"></div>

    <form id="form">
      <input id="input" autocomplete="off" placeholder="Y.O.K.E. kitta pesu..." />
      <button type="submit">Send 💌</button>
    </form>

    <section id="surprise">
      <h3>🎁 Surprise for <span class="her"></span></h3>
      <img id="couplePic" class="cartoon" alt="">
      <div id="songBox"></div>
      <h4>Videos I made for you</h4>
      <ul id="videos"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
