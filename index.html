<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y.O.K.E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOCK SCREEN (before birthday) -->
  <section id="lock" class="screen">
    <h1>Y.O.K.E.</h1>
    <p class="tag">You're Our Kind of Everything</p>
    <img id="lockPic" class="cartoon" alt="">
    <p>Something special is waiting for you, <span class="her"></span> 💛</p>
    <div id="countdown">--</div>
  </section>

  <!-- MAIN APP -->
  <main id="app" class="hidden">
    <header>
      <div class="avatar-wrap"><img id="avatar" class="avatar" alt=""></div>
      <div>
        <h2 class="brand">Y.O.K.E.</h2>
        <div class="status">You're Our Kind of Everything 💗</div>
      </div>
    </header>

    <div id="chat"></div>
    <div id="chips"></div>

    <form id="form">
      <input id="input" autocomplete="off" placeholder="Y.O.K.E. kitta pesu... 💌" />
      <button type="submit" class="send" aria-label="Send">➤</button>
    </form>

    <section id="gift">
      <button id="giftBtn" class="giftbtn" type="button">🎁 Tap to open your gift</button>
      <div id="giftContent" class="hidden"></div>
    </section>

    <footer>Made with 💛 by <span id="youName"></span></footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
